server:
  # ---- Container ----
  # Run in the foreground, log to stderr so docker logs shows it
  do-daemonize: no
  use-syslog: no
  logfile: ""
  verbosity: 1
  # No chroot, so the trust anchor file below stays reachable
  chroot: ""
  username: "unbound"

  # ---- Network ----
  # Listen on all container interfaces. Docker only publishes it on 127.0.0.1.
  interface: 0.0.0.0
  port: 5335
  # Only the host and the containers on dns-net
  access-control: 127.0.0.0/8 allow
  access-control: 172.30.53.0/24 allow
  do-ip4: yes
  # Docker bridges have no IPv6 unless you turn it on. Set yes if yours does.
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  edns-buffer-size: 1232
  # Needs net.core.rmem_max >= 1048576 on the host or the kernel ignores it
  so-rcvbuf: 1m

  # ---- Performance ----
  # Match num-threads to your CPU cores. Slabs only matter above 1 thread.
  num-threads: 1
  msg-cache-slabs: 8
  rrset-cache-slabs: 8
  infra-cache-slabs: 8
  key-cache-slabs: 8

  # ---- Privacy ----
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes

  # ---- Security and DNSSEC ----
  # Root trust anchor, mounted from the host's dns-root-data package so the
  # host's package manager keeps it current through root key changes. The
  # image's own copy can be stale, and with a stale key every lookup SERVFAILs.
  # This file replaces the image's unbound.conf, so the anchor has to be set
  # here or DNSSEC is off.
  # Test: dig @127.0.0.1 -p 5335 dnssec-failed.org should return SERVFAIL.
  trust-anchor-file: "/etc/unbound/root.key"
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-referral-path: yes
  harden-algo-downgrade: no
  aggressive-nsec: yes
  # 0x20 case randomization breaks some authoritative servers
  use-caps-for-id: no
  # Flush the cache if this many unexpected replies arrive (poisoning defense)
  unwanted-reply-threshold: 10000

  # ---- Cache ----
  rrset-cache-size: 256m
  msg-cache-size: 128m
  cache-min-ttl: 60
  cache-max-ttl: 14400
  prefetch: yes
  prefetch-key: yes
  target-fetch-policy: "3 2 1 1 1"
  rrset-roundrobin: yes
  # Serve expired records for up to an hour, only if a fresh lookup takes over 1.8s
  serve-expired: yes
  serve-expired-ttl: 3600
  serve-expired-client-timeout: 1800

  # ---- Rebinding protection ----
  # Strip private addresses from public answers.
  # Loopback is included, so services that resolve to 127.0.0.1 on purpose won't work.
  private-address: 0.0.0.0/8
  private-address: 10.0.0.0/8
  private-address: 100.64.0.0/10
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: ::1/128
  private-address: ::ffff:0:0/96
  private-address: fc00::/7
  private-address: fe80::/10
