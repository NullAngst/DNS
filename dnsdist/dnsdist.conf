-- dnsdist front end for AdGuard Home. Plain DNS on 53 only.
-- AdGuard Home keeps DoH (443), DoT (853/tcp) and DoQ (853/udp) itself.
--
-- The container uses host networking, so 127.0.0.1 here is the host, and the
-- listeners below are the host's port 53. See the README for why.

-- ---- Backend ----
-- AdGuard Home's plain DNS listener, moved off 53. Firewall this port from outside.
-- If AdGuard Home runs in Docker on dns-net, use its dns-net address instead,
-- for example 172.30.53.2:5300.
newServer({address="127.0.0.1:5300", name="adguard"})

-- ---- Listeners ----
setLocal("0.0.0.0:53")
addLocal("[::]:53")

-- dnsdist only answers private ranges by default. A public resolver has to open this up.
-- FOR A HOME SERVER, DO NOT USE 0.0.0.0/0. Use your LAN ranges instead, for example
-- setACL({"127.0.0.0/8", "192.168.0.0/16", "::1/128", "fe80::/10"})
setACL({"0.0.0.0/0", "::/0"})

-- ---- Blocklist ----
-- One IP or CIDR per line, # for comments. Written by update-blocklist.sh,
-- which restarts this container when the list changes. A bad line is skipped
-- with a warning instead of stopping dnsdist from starting.
local blocklist = "/etc/dnsdist/blocklist/blocked.txt"
blocked = newNMG()
local f = io.open(blocklist, "r")
if f then
  local count, bad = 0, 0
  for line in f:lines() do
    line = line:gsub("#.*", ""):gsub("%s+", "")
    if line ~= "" then
      if pcall(function() blocked:addMask(line) end) then
        count = count + 1
      else
        bad = bad + 1
        warnlog("Skipping invalid blocklist entry: " .. line)
      end
    end
  end
  f:close()
  infolog(string.format("Loaded %d blocklist entries, skipped %d", count, bad))
else
  warnlog(blocklist .. " not found, starting with an empty blocklist")
end

-- ---- Rules, first match wins ----
-- Blocked addresses get dropped before anything else, so they never get a reply,
-- not even a TC one.
addAction(NetmaskGroupRule(blocked), DropAction())

-- ANY has no legitimate use on a public resolver
addAction(QTypeRule(DNSQType.ANY), DropAction())

-- EMERGENCY ABUSE ONLY: Uncomment to force TC=1 on all UDP queries and require TCP.
-- Everything UDP below this line stops mattering while it's on.
-- addAction(TCPRule(false), TCAction())

-- Big-answer types over UDP always get TC, real clients retry over TCP
addAction(AndRule({OrRule({QTypeRule(DNSQType.TXT), QTypeRule(DNSQType.DNSKEY), QTypeRule(DNSQType.RRSIG)}), TCPRule(false)}), TCAction())

-- Over 20 qps per IP on UDP gets TC instead of dropped, so NAT users still resolve
-- IPv4 counted per /32, IPv6 per /64, burst of 100
addAction(AndRule({MaxQPSIPRule(20, 32, 64, 100), TCPRule(false)}), TCAction())

-- Hard ceiling on TCP, kept well above the UDP limit
addAction(MaxQPSIPRule(100, 32, 64, 200), DropAction())

-- ---- Misc ----
-- Disable security status polling via DNS
setSecurityPollSuffix("")
