# PowerDNS Recursor for Portainer
#
# Paste this into Portainer: Stacks, Add stack, Web editor.
# Same as compose.yml, with absolute paths to the configs in /opt/DNS, since
# Portainer CE stacks can't use relative paths. If you cloned the repo somewhere
# else, change /opt/DNS in the volumes lines.

services:
  pdns-recursor:
    container_name: pdns-recursor
    # PowerDNS names images by release series: pdns-recursor-54 is 5.4.x.
    # No image follows the newest series, so check for a newer one every
    # couple of months. See maintenance.md.
    image: powerdns/pdns-recursor-54:latest
    ports:
      - "127.0.0.1:5354:5354/tcp"
      - "127.0.0.1:5354:5354/udp"
    volumes:
      - /opt/DNS/pdns-recursor/recursor.yml:/etc/powerdns/recursor.yml:ro
      - /opt/DNS/pdns-recursor/rebind.lua:/etc/powerdns/rebind.lua:ro
    networks:
      dns-net:
        ipv4_address: 172.30.53.5
    restart: unless-stopped

# Shared with the Unbound stack and anything else that needs DNS.
# Create it once before the first start, see the README.
networks:
  dns-net:
    external: true
    name: dns-net
